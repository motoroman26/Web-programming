# Вхід у кластер за доменом:
#   docuflow.local     → фронтенд (docuflow-web)
#   api.docuflow.local → бекенд (docuflow-api)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docuflow-ingress
  namespace: docuflow
  annotations:
    # Дозволяємо завантаження файлів до 10 МБ (+ запас)
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"
spec:
  ingressClassName: nginx
  rules:
    - host: docuflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docuflow-web
                port: { number: 80 }
    - host: api.docuflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docuflow-api
                port: { number: 80 }
