# PostgreSQL: StatefulSet з постійним диском (PVC), щоб дані переживали перезапуск пода
apiVersion: v1
kind: Service
metadata:
  name: docuflow-db
  namespace: docuflow
spec:
  type: ClusterIP
  selector:
    app: docuflow-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: docuflow-db
  namespace: docuflow
spec:
  serviceName: docuflow-db
  replicas: 1
  selector:
    matchLabels:
      app: docuflow-db
  template:
    metadata:
      labels:
        app: docuflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: docuflow-config, key: PGDATABASE } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: docuflow-config, key: PGUSER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: docuflow-secret, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "docuflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
