# Секрети: пароль БД і ключ підпису JWT.
# Значення нижче — лише для локального Minikube. Для справжнього кластера створюйте секрет командою
#   kubectl create secret generic docuflow-secret -n docuflow \
#     --from-literal=PGPASSWORD=... --from-literal=POSTGRES_PASSWORD=... --from-literal=JWT_SECRET=...
# і не зберігайте справжні значення в git.
apiVersion: v1
kind: Secret
metadata:
  name: docuflow-secret
  namespace: docuflow
type: Opaque
stringData:
  PGPASSWORD: "minikube-db-password"
  POSTGRES_PASSWORD: "minikube-db-password"
  JWT_SECRET: "minikube-jwt-secret-change-me"
