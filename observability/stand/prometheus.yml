global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: []

scrape_configs:
  - job_name: demo-app
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['app:3000']
        labels:
          service: demo-app
  - job_name: otel-collector
    static_configs:
      - targets: ['collector:8888']
  # DocuFlow (лаба 8): OTLP-метрики docuflow-api з колектора
  - job_name: docuflow-otlp
    scrape_interval: 5s
    static_configs:
      - targets: ['collector:8889']
